name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Hazır mı kontrol et
        run: |
          if ls src/main/java/dev/sculk/*.java >/dev/null 2>&1; then
            echo "hazir"
          else
            echo "::error::src/main/java boş. Önce Bootstrap workflow'unu çalıştır."
            exit 1
          fi

      - name: Build
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build --no-daemon 2>&1 | tee build.log

      - name: Hata özeti
        if: failure()
        run: |
          echo "===== HATA SAYISI ====="
          grep -c 'error:' build.log || true
          echo "===== HATA TÜRLERİ (sayı, mesaj) ====="
          grep 'error:' build.log | sed -E 's/.*error: //' | sort | uniq -c | sort -rn | head -40 || true
          echo "===== HATALAR (dosya:satır + kod) ====="
          grep -A1 'error:' build.log | sed -E 's|/home/runner/work/[^/]+/[^/]+/src/main/java/||' | grep -v '^--$' | head -300 || true

      - name: Çıktı jar'ını seç
        id: pick
        run: |
          set -euo pipefail
          jar="$(ls build/libs/*.jar | grep -v -e '-dev.jar' -e '-sources.jar' | head -n 1)"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          echo "Jar: $jar"

      - name: Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: sculk
          path: ${{ steps.pick.outputs.jar }}
          if-no-files-found: error
